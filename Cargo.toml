[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = { version = "0.13", features = ["tokio"] }
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9"
padsmith-core = { path = "crates/core" }
padsmith-protocol = { path = "crates/protocol" }
padsmith-linux = { path = "crates/linux" }

[profile.release]
lto = "thin"
codegen-units = 1
